<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="icon" href="./calculator.png">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./app.js"></script>
</head>
<body>
    <div class="main-container">
      <form>
        <h3>Calculator</h3>
        <input type="text" class="input-class" id="inputField">
        <div class="inner-container" id="divBtn">
          <input type="button" value="AC" class="inputbtn">
          <button type="button">00</button>
          <button type="button">%</button>
          <button type="button">/</button>
          <button type="button">7</button>
          <button type="button">8</button>
          <button type="button">9</button>
          <button type="button">*</button>
          <button type="button">4</button>
          <button type="button">5</button>
          <button type="button">6</button>
          <button type="button">-</button>
          <button type="button">1</button>
          <button type="button">2</button>
          <button type="button">3</button>
          <button type="button">+</button>
          <button class="btn-0">0</button>
          <button type="button">.</button>
          <input type="button" value="=" class="inputbtn">
        </div>
      </form>
    </div>
</body>
</html>
