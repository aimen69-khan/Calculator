<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="icon" href="./calculator.png">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./app.js"></script>
</head>
<body>
    <div class="main-container">
      <form>
        <h3>Calculator</h3>
        <input type="text" class="input-class">
        <div class="inner-container">
          <button>AC</button>
          <button>00</button>
          <button>%</button>
          <button>/</button>
          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button>*</button>
          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button>-</button>
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button>+</button>
          <button class="btn-0">0</button>
          <button>.</button>
          <button>=</button>
        </div>
      </form>
    </div>
</body>
</html>
